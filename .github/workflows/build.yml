name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'source.tar.gz'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f source.tar.gz
          mkdir -p _source
          tar -xzf source.tar.gz -C _source
          wrapper="$(find _source -type f -name gradlew -print -quit)"
          if [ -z "$wrapper" ]; then
            echo "ERROR: source.tar.gz 中找不到 gradlew"
            exit 1
          fi
          cp -a "$(dirname "$wrapper")/." .
          chmod +x gradlew
          test -f settings.gradle -o -f settings.gradle.kts
          test -f app/build.gradle -o -f app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
